version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          VERSION: '{{.VERSION}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: 'test "{{OS}}" = "linux"'
        msg: "Linux builds require a Linux host. Cross-compilation via Docker isn't set up for this project; build on Linux or in CI. Never build Linux locally per project convention — let CI verify it."
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      # Always built with the `gtk3` tag: wails v3's default Linux backend is
      # GTK4 + WebKitGTK 6.0 (libgtk-4-dev/libwebkitgtk-6.0-dev), which isn't
      # packaged on ubuntu-22.04 (our pinned CI/release runner). The `gtk3` tag
      # keeps the GTK3 + WebKit2GTK-4.1 backend used since v2 (libgtk-3-dev/
      # libwebkit2gtk-4.1-dev, both available on 22.04). Note: upstream marks
      # gtk3 legacy and slated for removal in wails v3.1 - revisit then.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags gtk3{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}}-tags gtk3,production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s{{if .VERSION}} -X main.appVersion={{.VERSION}}{{end}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application for Linux (AppImage only)
    cmds:
      - task: create:appimage
        vars:
          VERSION: '{{.VERSION}}'

  create:appimage:
    summary: Creates the same self-contained AppImage used by CI and releases
    dir: '{{.ROOT_DIR}}'
    deps:
      - task: build
        vars:
          VERSION: '{{.VERSION}}'
    cmds:
      - |
        set -eu
        tools="$(mktemp -d /tmp/tdrive-appimage-tools.XXXXXX)"
        trap 'rm -rf "$tools"' EXIT
        bash scripts/acquire-appimage-tools.sh "$tools"
        export TDRIVE_LINUXDEPLOY="$tools/linuxdeploy-x86_64.AppImage"
        export TDRIVE_APPIMAGETOOL="$tools/appimagetool-x86_64.AppImage"
        touch "$tools/runtime.env"
        RUNNER_TEMP="$tools" GITHUB_ENV="$tools/runtime.env" bash scripts/prepare-mpv-runtime.sh
        while IFS='=' read -r name value; do
          export "$name=$value"
        done < "$tools/runtime.env"
        bash scripts/package-appimage.sh "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.VERSION | default "dev"}}" "{{.BIN_DIR}}"

  generate:dotdesktop:
    summary: Regenerates build/linux/TDrive.desktop from scratch (NOT run automatically - see note)
    desc: |
      build/linux/TDrive.desktop is a hand-customised file (custom Comment and
      Categories) and is intentionally NOT a build dependency, unlike the wails3
      default. Run this manually only if you want to discard the customisation
      and start from a fresh template, then re-apply the Comment/Categories by
      hand.
    dir: build
    cmds:
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "{{.CATEGORIES}}" -comment "{{.COMMENT}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Utility;Network;'
      COMMENT: 'Use a private Telegram channel as cloud storage'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
