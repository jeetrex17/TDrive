name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CGO_ENABLED: 1
  # main (and anything importing it) needs the gtk3 build tag on Linux - see
  # build/linux/Taskfile.yml for why wails v3 is built against GTK3 +
  # WebKit2GTK-4.1 here instead of its new GTK4 default.
  GOFLAGS: "-tags=gtk3"
  FIRST_PARTY_GO_PACKAGES: ". ./internal/... ./cmd/... ./backend/..."
  RACE_GO_PACKAGES: >-
    .
    ./internal/...
    ./cmd/tdrive
    ./backend/core
    ./backend/crypto
    ./backend/daemon
    ./backend/media
    ./backend/mountadapter
    ./backend/mountcache
    ./backend/mountcontent
    ./backend/mountcontroller
    ./backend/mountdav
    ./backend/mountfs
    ./backend/mountwrite
    ./backend/photobackup
    ./backend/projection
    ./backend/services/...
    ./backend/sync
    ./backend/tgclient
    ./backend/updater

jobs:
  test:
    name: Tests and frontend build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Validate media packaging scripts
        run: bash -n scripts/acquire-mpv-runtime.sh scripts/prepare-mpv-runtime.sh scripts/mpv-metadata.sh scripts/mpv-linux-libraries.sh scripts/package-mpv-darwin.sh scripts/package-mpv-linux.sh scripts/test-acquire-mpv-runtime.sh scripts/test-mpv-metadata.sh scripts/test-mpv-linux-libraries.sh scripts/test-package-mpv-darwin.sh scripts/test-prepare-mpv-runtime.sh

      - name: Run media parser tests
        run: bash scripts/test-mpv-metadata.sh

      - name: Run media runtime acquisition tests
        run: bash scripts/test-acquire-mpv-runtime.sh

      - name: Test AppImage launcher
        run: |
          bash -n scripts/acquire-appimage-tools.sh scripts/package-appimage.sh scripts/smoke-appimage.sh build/linux/AppRun
          bash scripts/test-appimage-launcher.sh
          bash scripts/test-acquire-appimage-tools.sh

      - name: Run Linux media dependency tests
        run: bash scripts/test-mpv-linux-libraries.sh

      - name: Run macOS media packaging contract tests
        run: bash scripts/test-package-mpv-darwin.sh

      - name: Validate Android release helpers
        run: |
          bash -n scripts/android-version-code.sh scripts/test-android-version-code.sh scripts/android-signer-digests.sh scripts/test-android-signer-digests.sh
          bash scripts/test-android-version-code.sh
          bash scripts/test-android-signer-digests.sh

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      # Keep the zero-warning gate; fix new warnings instead of raising it.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test $FIRST_PARTY_GO_PACKAGES

      - name: Run Go vet
        run: go vet $FIRST_PARTY_GO_PACKAGES

  browser-contracts:
    name: Browser frontend contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Chromium and WebKit
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Run production-build browser contracts
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Run WebKit gallery contracts
        working-directory: frontend
        run: npx playwright test --config playwright.gallery-webkit.config.ts

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-media-contracts:
    name: WebKit media contracts
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install WebKit
        working-directory: frontend
        run: npx playwright install webkit

      # macOS WebKit has the media codecs used by Safari; Linux WebKit can
      # behave differently for video playback even when UI interactions work.
      - name: Run WebKit media contracts
        working-directory: frontend
        run: npm run test:e2e -- --project=webkit-media

      - name: Upload WebKit media failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-webkit-media-failure-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  race:
    name: Targeted race detector
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Run targeted race tests
        run: go test -race -count=1 $RACE_GO_PACKAGES

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # SA* is correctness, S*/QF* are simplifications, U1000 is dead code.
      # -SA1012 because nil contexts are passed intentionally by
      # boundary-validation tests.
      #
      # U1000 cannot see across build tags: a symbol whose only callers sit
      # behind //go:build ios, darwin or windows looks unused in this Linux
      # run. Running the whole matrix and intersecting the results would need
      # cross-compiling cgo for three platforms and a script to merge them, for
      # a handful of symbols that change about once a year. Instead each such
      # symbol carries a //lint:ignore U1000 naming the file that uses it —
      # staticcheck does not complain about an ignore directive that turns out
      # to be unnecessary, so the same command is clean on every GOOS and a
      # developer can run it locally on macOS and get CI's answer.
      - name: Run staticcheck correctness, simplification, and dead-code analyzers
        run: staticcheck -checks='SA*,-SA1012,S*,QF*,U1000' $FIRST_PARTY_GO_PACKAGES

      - name: Run govulncheck
        run: govulncheck $FIRST_PARTY_GO_PACKAGES

  # frontend/bindings is generated from the Go source by
  # `wails3 generate bindings` (build/Taskfile.yml's generate:bindings, which
  # build:frontend depends on) and then committed, and until this job nothing
  # compared the two. A bound method whose signature changes without a
  # regeneration leaves the frontend calling a backend that no longer looks
  # like that: a runtime failure every other job here stays green through.
  bindings:
    name: Generated bindings
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The generator type-checks the whole module through go/packages, and
      # main embeds frontend/dist, so with no frontend built the root package
      # carries an embed error, no service is found, and the run would compare
      # the committed bindings against nothing at all.
      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      # Pinned to the wails version in go.mod. The generator ships inside the
      # CLI, so a different CLI emits different files and the check below
      # would fail on code nobody touched.
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The same flags generate:bindings passes; the gtk3 build tag arrives
      # through the workflow-level GOFLAGS, which is how every other Go job
      # here loads the module.
      #
      # That is one set of build tags, and bindings are generated per platform
      # with that platform's tags -- android,debug, ios,debug, gtk3 on Linux,
      # production, and the desktop dev build's empty set -- while a single
      # copy is committed for all of them. That holds only while no bound
      # method sits behind a build tag: today none does, so every set produces
      # the same files and the copy this job checks is the right one
      # everywhere. Put an exported service method behind a tag and four of
      # the five platforms start shipping bindings that disagree with their
      # own build, and this job will not see it. Keep bound methods untagged;
      # the android and iOS jobs below already regenerate with their own tags,
      # so that is where a check for the other sets would go.
      - name: Check the committed bindings are current
        run: |
          set -euo pipefail
          wails3 generate bindings -clean=true -ts -i

          # --intent-to-add so that files the generator adds -- a new service,
          # a newly bound package -- show up in the diff instead of sitting
          # untracked and invisible, which is the likeliest shape of a miss
          # while App is being split into services.
          git add --intent-to-add frontend/bindings
          if ! git diff --exit-code -- frontend/bindings; then
            echo
            echo "frontend/bindings does not match the Go source: the diff above is what"
            echo "regenerating produced. Shipping it would call methods the backend no"
            echo "longer has. Regenerate from the repository root with:"
            echo
            echo "    wails3 generate bindings -clean=true -ts -i"
            echo
            echo "and commit frontend/bindings. Any 'wails3 task build' does it too, since"
            echo "build:frontend depends on generate:bindings."
            exit 1
          fi

  wails-build:
    name: Wails build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-15
            platform: darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Windows media parser and packaging contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-mpv-metadata.ps1
          ./scripts/test-package-mpv-windows.ps1

      - name: Read Windows Store version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath build/config.yml -Raw
          $match = [regex]::Match($config, '(?m)^  version: "([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $match.Success) { throw "build/config.yml must have a three-part info.version" }
          "TDRIVE_STORE_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Windows native media tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./backend/nativeplayer

      # Runs on Linux, Windows, and macOS (matrix) so folder download and
      # its tests execute natively on each OS instead of only
      # cross-compiling. Keep in sync with release.yml.
      - name: Run daemon, mount, and folder-download tests
        run: go test -count=1 ./cmd/tdrive ./backend/daemon ./backend/mountfs ./backend/mountcontent ./backend/mountdav ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Vet platform-specific daemon and CLI code
        run: go vet ./cmd/tdrive ./backend/daemon ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Build CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          go build -trimpath -o .ci-bin/tdrive ./cmd/tdrive

      # These commands must work before login and without starting the daemon.
      # Reuse the native build matrix so the contract is checked on all targets.
      - name: Smoke test offline CLI JSON (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          .ci-bin/tdrive version --json | jq -s -e '
            length == 1 and .[0].schema_version == 1 and .[0].ok == true and
            .[0].command == "version" and (.[0].data.version | type == "string") and
            (.[0].data.commit | type == "string") and (.[0].data.protocol | type == "number")
          '
          .ci-bin/tdrive commands --json | jq -s -e '
            length == 1 and .[0].schema_version == 1 and .[0].ok == true and
            .[0].command == "commands" and
            (.[0].data.global_flags | index("--json") != null) and
            (.[0].data.commands | any(.name == "ls"))
          '

      - name: Build and verify Windows CLI package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-cli-release-windows.ps1 -Version ci

          $archive = "dist/TDrive-ci-windows-amd64-cli.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "tdrive-cli-package"
          Expand-Archive -Path $archive -DestinationPath $extractDirectory -Force

          $packageDirectory = Join-Path $extractDirectory "TDrive-ci-windows-amd64-cli"
          foreach ($file in @("tdrive.exe", "README.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDirectory $file) -PathType Leaf)) {
              throw "Windows CLI package is missing $file"
            }
          }

      - name: Smoke test offline CLI JSON (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $env:RUNNER_TEMP "tdrive-cli-package/TDrive-ci-windows-amd64-cli/tdrive.exe"
          $versionOutput = @(& $executable version --json)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1) {
            throw "version --json failed or emitted more than one line"
          }
          $version = $versionOutput[0] | ConvertFrom-Json
          if ($version.schema_version -ne 1 -or $version.ok -ne $true -or $version.command -ne "version" -or
              $version.data.version -isnot [string] -or $version.data.commit -isnot [string] -or
              ($version.data.protocol -isnot [int] -and $version.data.protocol -isnot [long])) {
            throw "version --json has an unexpected schema"
          }

          $commandsOutput = @(& $executable commands --json)
          if ($LASTEXITCODE -ne 0 -or $commandsOutput.Count -ne 1) {
            throw "commands --json failed or emitted more than one line"
          }
          $commands = $commandsOutput[0] | ConvertFrom-Json
          if ($commands.schema_version -ne 1 -or $commands.ok -ne $true -or $commands.command -ne "commands" -or
              "--json" -notin $commands.data.global_flags -or "ls" -notin $commands.data.commands.name) {
            throw "commands --json has an unexpected schema"
          }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$sources"
            fi
          done

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev mpv imagemagick librsvg2-dev libgirepository1.0-dev

      # Uses the checksum-pinned runtime archive when the repository variables
      # are set and the runner's package-manager mpv otherwise. Keep in sync
      # with release.yml.
      - name: Prepare media runtime
        shell: bash
        env:
          TDRIVE_LINUX_MPV_RUNTIME_URL: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_URL }}
          TDRIVE_LINUX_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_SHA256 }}
          TDRIVE_MACOS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_URL }}
          TDRIVE_MACOS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_SHA256 }}
          TDRIVE_WINDOWS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_URL }}
          TDRIVE_WINDOWS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_SHA256 }}
        run: bash scripts/prepare-mpv-runtime.sh

      - name: Test macOS media cache invalidation
        if: runner.os == 'macOS'
        run: bash scripts/test-prepare-mpv-runtime.sh

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # macOS needs the .app bundle (`package`) since the media-bundle contract
      # check below looks for build/bin/TDrive.app. Linux/Windows only need the
      # bare binary (`build`); CI and release use the same AppImage packaging
      # script below. Windows packaging also verifies NSIS and Store MSIX.
      - name: Build Wails app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            wails3 task package VERSION=ci
          elif [ "$RUNNER_OS" = "Windows" ]; then
            wails3 task build VERSION="$TDRIVE_STORE_VERSION"
          else
            wails3 task build VERSION=ci
          fi

      - name: Test Windows app update and package identity behavior
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/app ./backend/updater

      - name: Package and smoke test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/acquire-appimage-tools.sh "$RUNNER_TEMP/appimage-tools"
          export TDRIVE_LINUXDEPLOY="$RUNNER_TEMP/appimage-tools/linuxdeploy-x86_64.AppImage"
          export TDRIVE_APPIMAGETOOL="$RUNNER_TEMP/appimage-tools/appimagetool-x86_64.AppImage"
          bash scripts/package-appimage.sh build/bin/TDrive ci dist
          docker build -f .github/appimage-smoke.Dockerfile -t tdrive-appimage-smoke scripts
          mkdir -p appimage-smoke-artifacts
          chmod 777 appimage-smoke-artifacts
          docker run --rm --network none --security-opt seccomp=unconfined \
            -v "$PWD/appimage-smoke-artifacts:/output" -e TDRIVE_SMOKE_ARTIFACTS=/output \
            -v "$PWD/dist:/input:ro" tdrive-appimage-smoke /input/TDrive-ci-x86_64.AppImage

      - name: Upload AppImage smoke artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appimage-smoke-${{ github.run_id }}
          path: appimage-smoke-artifacts/
          if-no-files-found: ignore

      - name: Package and validate macOS media bundle contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/bin/TDrive.app ]; then
            app_path=build/bin/TDrive.app
          else
            app_path="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          fi
          [ -n "$app_path" ] || { echo "no macOS app bundle found" >&2; exit 1; }
          ./scripts/package-mpv-darwin.sh "$app_path"

      - name: Verify Windows media bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path build/bin -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $app) {
            throw "no Windows executable found in build/bin"
          }
          ./scripts/package-mpv-windows.ps1 $app.FullName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force -Path $app.FullName, "build/bin/media" -DestinationPath "dist/TDrive-windows-amd64-ci.zip"

      # The runner image has no NSIS; the Chocolatey package installs under
      # Program Files (x86) without touching PATH. Keep in sync with release.yml.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path -LiteralPath (Join-Path $nsis "makensis.exe") -PathType Leaf)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "nsis install failed" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          & (Join-Path $nsis "makensis.exe") /VERSION

      # The installer is exercised for real: a silent install into a scratch
      # folder must lay out the exe and the media runtime, and the silent
      # uninstall must take them away again.
      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails3 task windows:installer INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { throw "windows installer build failed" }
          $setup = (Resolve-Path "build/bin/TDrive-amd64-installer.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "tdrive-installed"

          # NSIS: /S is silent; /D= must be the last argument and unquoted.
          $install = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList "/S", "/D=$target"
          if ($install.ExitCode -ne 0) { throw "silent install exited with $($install.ExitCode)" }
          foreach ($file in @("TDrive.exe", "uninstall.exe", "media\mpv.exe", "media\media-runtime.sha256")) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file) -PathType Leaf)) {
              throw "installed layout is missing $file"
            }
          }

          # _?= runs the uninstaller in place so it can be waited on.
          $uninstall = Start-Process -Wait -PassThru -FilePath (Join-Path $target "uninstall.exe") -ArgumentList "/S", "_?=$target"
          if ($uninstall.ExitCode -ne 0) { throw "silent uninstall exited with $($uninstall.ExitCode)" }
          foreach ($file in @("TDrive.exe", "media\mpv.exe")) {
            if (Test-Path -LiteralPath (Join-Path $target $file)) {
              throw "uninstall left $file behind"
            }
          }

          Copy-Item -LiteralPath $setup -Destination "dist/TDrive-windows-amd64-ci-setup.exe"

      - name: Upload Windows CI package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDrive-windows-amd64-ci
          path: |
            dist/TDrive-windows-amd64-ci.zip
            dist/TDrive-windows-amd64-ci-setup.exe
          if-no-files-found: error
          retention-days: 7

  windows-msix:
    needs: [approve-ci, wails-build]
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Windows Store sideload package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Store version and test packaging contract
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath build/config.yml -Raw
          $match = [regex]::Match($config, '(?m)^  version: "([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $match.Success) { throw "build/config.yml must have a three-part info.version" }
          "TDRIVE_STORE_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV
          ./scripts/test-package-msix.ps1

      - name: Download Windows build and qualified media
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: TDrive-windows-amd64-ci
          path: msix-input

      - name: Restore staged Windows build
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath msix-input/TDrive-windows-amd64-ci.zip -DestinationPath build/bin -Force
          foreach ($file in @("TDrive.exe", "media/mpv.exe", "media/media-runtime.manifest")) {
            if (-not (Test-Path -LiteralPath (Join-Path "build/bin" $file) -PathType Leaf)) {
              throw "Windows build is missing $file"
            }
          }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails task runner
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # This ephemeral certificate is for CI sideloading. Store submission uses
      # the unsigned task output and release-qualified mpv. No private signing
      # key is exported or included in the upload path.
      - name: Build signed sideload MSIX
        shell: pwsh
        run: |
          wails3 task windows:store:package PACKAGE_VERSION=$env:TDRIVE_STORE_VERSION TEST_SIGN=true
          if ($LASTEXITCODE -ne 0) { throw "Windows Store test package build failed" }

      - name: Unpack and install signed MSIX
        shell: powershell
        run: |
          $base = "dist/TDrive-$env:TDRIVE_STORE_VERSION-windows-x64-test"
          $package = "$base.msix"
          $certificate = "$base.cer"
          $instructions = "$base-install.txt"
          foreach ($file in @($package, $certificate, $instructions)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "MSIX artifact is missing: $file" }
          }

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin"
          $makeappx = Get-ChildItem -LiteralPath $sdkBin -Filter makeappx.exe -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]makeappx\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeappx) { throw "Windows SDK makeappx.exe was not found" }
          $unpacked = Join-Path $env:RUNNER_TEMP "tdrive-store-unpacked"
          & $makeappx.FullName unpack /p $package /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx could not unpack the signed MSIX" }
          foreach ($file in @("AppxManifest.xml", "TDrive.exe", "media/mpv.exe", "media/media-runtime.sha256")) {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $file) -PathType Leaf)) {
              throw "unpacked MSIX is missing $file"
            }
          }

          [xml]$manifest = Get-Content -LiteralPath (Join-Path $unpacked "AppxManifest.xml") -Raw
          $identityName = $manifest.Package.Identity.Name
          if ([string]::IsNullOrWhiteSpace($identityName)) { throw "MSIX manifest has no package identity" }
          $trustedCertificate = Import-Certificate -FilePath $certificate -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          try {
            Add-AppxPackage -Path (Resolve-Path -LiteralPath $package).Path -ErrorAction Stop
            $installed = Get-AppxPackage -Name $identityName
            if ($null -eq $installed) { throw "signed MSIX did not register package $identityName" }
            $installedManifest = Get-AppxPackageManifest -Package $installed.PackageFullName
            if ($installedManifest.Package.Applications.Application.Executable -ne "TDrive.exe") {
              throw "installed MSIX does not launch TDrive.exe"
            }

            if (Get-Process explorer -ErrorAction SilentlyContinue) {
              $appId = $installedManifest.Package.Applications.Application.Id
              Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$($installed.PackageFamilyName)!$appId"
              $launched = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                if (Get-Process TDrive -ErrorAction SilentlyContinue) { $launched = $true; break }
                Start-Sleep -Seconds 1
              }
              if (-not $launched) { throw "installed TDrive did not launch through its package identity" }
              Get-Process TDrive | Stop-Process -Force
            }
            else {
              Write-Host "::notice::GUI launch smoke skipped: runner has no interactive Explorer shell. MSIX installation and registration passed."
            }
          }
          finally {
            $installed = Get-AppxPackage -Name $identityName
            if ($null -ne $installed) { $installed | Remove-AppxPackage -ErrorAction Stop }
            if ($null -ne $trustedCertificate) {
              Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($trustedCertificate.Thumbprint)" -ErrorAction Stop
            }
          }

      - name: Upload Windows Store sideload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDrive-windows-x64-msix-test
          path: |
            dist/TDrive-*-windows-x64-test.msix
            dist/TDrive-*-windows-x64-test.cer
            dist/TDrive-*-windows-x64-test-install.txt
          if-no-files-found: error
          retention-days: 7

  # The phone builds. Nothing above compiles them: the Android host is Java the
  # Go toolchain never sees, the iOS host is Objective-C linked in at the very
  # last step, and every Go file behind an `ios` or `android` build tag is
  # invisible to a desktop build. A change to any of them can pass every other
  # job here and still ship a phone app that does not compile.
  android-build:
    name: Android build (arm64-v8a)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # gtk3 is the Linux desktop's tag and has no meaning when the target is
      # Android; carrying it into a cross compile breaks the build.
      GOFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      # The CLI is a build tool, not part of the app, and with cgo on it drags
      # in Wails' GTK bindings -- which default to GTK4 once the gtk3 tag is
      # gone, and no runner has gtk4 or webkitgtk-6.0. Built without cgo it is
      # a static binary that needs no system libraries at all. The cross
      # compiles below still run with cgo on, from the job env.
      - name: Install Wails CLI
        env:
          CGO_ENABLED: 0
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The Taskfile finds the newest NDK under $ANDROID_HOME/ndk when this is
      # unset, but the runner keeps its NDK elsewhere, so point at it directly.
      - name: Point the build at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # ARCH is explicit: the Taskfile defaults it to the host, and the runner
      # is x86_64, so leaving it out quietly builds the emulator's library and
      # never produces the arm64-v8a one a real phone loads.
      - name: Build the Go shared library
        run: wails3 task android:build ARCH=arm64

      - name: Assemble the APK
        run: wails3 task android:assemble:apk

      - name: Require a keystore for release signing
        working-directory: build/android
        run: |
          set -euo pipefail
          if ANDROID_REQUIRE_RELEASE_SIGNING=true ./gradlew help > "$RUNNER_TEMP/android-signing-guard.log" 2>&1; then
            echo "Gradle accepted release signing without a keystore" >&2
            exit 1
          fi
          grep -Fq 'Android release signing is required' "$RUNNER_TEMP/android-signing-guard.log"

      # Gradle reports success while packaging a .so it built earlier, so a
      # frontend-only change can produce an APK that still serves the previous
      # bundle. That has shipped twice by hand. The APK has to carry the
      # stylesheet this run just built, or the build is a lie.
      - name: Check the APK carries the frontend from this run
        run: |
          set -euo pipefail
          built=$(basename frontend/dist/assets/main-*.css)
          unzip -p build/bin/TDrive.apk lib/arm64-v8a/libwails.so > /tmp/libwails.so
          # Dumped to a file rather than piped into grep: `grep -q` exits the
          # moment it matches, strings takes a SIGPIPE for it, and pipefail
          # then reports the whole pipeline as failed -- on success.
          strings -a /tmp/libwails.so > /tmp/libwails.strings
          if ! grep -qF "$built" /tmp/libwails.strings; then
            echo "APK does not embed $built"
            echo "it embeds: $(grep -oE 'main-[A-Za-z0-9_-]+\.css' /tmp/libwails.strings | sort -u)"
            exit 1
          fi
          echo "APK embeds $built"

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDrive-android-arm64-ci
          path: build/bin/TDrive.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    name: iOS build (simulator bundle + device archive)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      # The CLI is a build tool, not part of the app, and with cgo on it drags
      # in Wails' GTK bindings -- which default to GTK4 once the gtk3 tag is
      # gone, and no runner has gtk4 or webkitgtk-6.0. Built without cgo it is
      # a static binary that needs no system libraries at all. The cross
      # compiles below still run with cgo on, from the job env.
      - name: Install Wails CLI
        env:
          CGO_ENABLED: 0
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The simulator bundle is ad-hoc signed, so it needs no Apple account and
      # still exercises the whole chain: the cgo behind the ios build tag, the
      # Wails Objective-C, and the link against build/ios/main.m.
      - name: Build the simulator app bundle
        run: wails3 task ios:package

      # A device build uses a different SDK and a different minimum-version
      # flag, and is the one a phone would actually run. Signing is left
      # ad-hoc: a real identity is only needed to install, not to compile.
      - name: Compile the device archive
        run: wails3 task ios:build IOS_PLATFORM=device

      - name: Verify the generated Xcode release bundle
        run: |
          wails3 task -f ios:generate:ios:xcode
          SETTINGS=$(xcodebuild -project build/ios/xcode/main.xcodeproj -target TDrive -configuration Release -sdk iphoneos -showBuildSettings)
          grep -q 'CLANG_ENABLE_OBJC_ARC = YES' <<<"$SETTINGS"
          grep -q 'CODE_SIGN_STYLE = Automatic' <<<"$SETTINGS"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0' <<<"$SETTINGS"
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon' <<<"$SETTINGS"

          xcodebuild -project build/ios/xcode/main.xcodeproj -target TDrive \
            -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO clean build

          APP=build/ios/xcode/build/Release-iphoneos/TDrive.app
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -x "$APP/$EXECUTABLE"
          test -f "$APP/Assets.car"
          test -d "$APP/LaunchScreen.storyboardc" || test -d "$APP/Base.lproj/LaunchScreen.storyboardc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "16.0"

      - name: Upload the simulator bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDrive-ios-simulator-ci
          path: build/bin/TDrive.app
          if-no-files-found: error
          retention-days: 7
