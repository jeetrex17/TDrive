name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CGO_ENABLED: 1

jobs:
  test:
    name: Tests and frontend build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libx11-dev

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  wails-build:
    name: Wails build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-15
            platform: darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run daemon and mount tests
        run: go test -count=1 ./cmd/tdrive ./backend/daemon ./backend/mountfs ./backend/mountcontent ./backend/mountdav ./backend/mountcontroller ./backend/mountos ./backend/updater

      - name: Vet platform-specific daemon and CLI code
        run: go vet ./cmd/tdrive ./backend/daemon ./backend/mountcontroller ./backend/mountos ./backend/updater

      - name: Build CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          go build -trimpath -o .ci-bin/tdrive ./cmd/tdrive

      - name: Build and verify Windows CLI package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-cli-release-windows.ps1 -Version ci

          $archive = "dist/TDrive-ci-windows-amd64-cli.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "tdrive-cli-package"
          Expand-Archive -Path $archive -DestinationPath $extractDirectory -Force

          $packageDirectory = Join-Path $extractDirectory "TDrive-ci-windows-amd64-cli"
          foreach ($file in @("tdrive.exe", "README.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDirectory $file) -PathType Leaf)) {
              throw "Windows CLI package is missing $file"
            }
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libx11-dev

      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Wails app
        shell: bash
        run: wails build -clean -platform "${{ matrix.platform }}"

      - name: Verify Windows media bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio.install --no-progress -y
          $app = Get-ChildItem -Path build/bin -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $app) {
            throw "no Windows executable found in build/bin"
          }
          ./scripts/package-mpv-windows.ps1 $app.FullName
