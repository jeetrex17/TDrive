name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CGO_ENABLED: 1
  # main (and anything importing it) needs the gtk3 build tag on Linux - see
  # build/linux/Taskfile.yml for why wails v3 is built against GTK3 +
  # WebKit2GTK-4.1 here instead of its new GTK4 default.
  GOFLAGS: "-tags=gtk3"
  FIRST_PARTY_GO_PACKAGES: ". ./cmd/... ./backend/..."

jobs:
  test:
    name: Tests and frontend build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Validate media packaging scripts
        run: bash -n scripts/acquire-mpv-runtime.sh scripts/prepare-mpv-runtime.sh scripts/mpv-metadata.sh scripts/mpv-linux-libraries.sh scripts/package-mpv-darwin.sh scripts/package-mpv-linux.sh scripts/test-acquire-mpv-runtime.sh scripts/test-mpv-metadata.sh scripts/test-mpv-linux-libraries.sh scripts/test-package-mpv-darwin.sh scripts/test-prepare-mpv-runtime.sh

      - name: Run media parser tests
        run: bash scripts/test-mpv-metadata.sh

      - name: Run media runtime acquisition tests
        run: bash scripts/test-acquire-mpv-runtime.sh

      - name: Run Linux media dependency tests
        run: bash scripts/test-mpv-linux-libraries.sh

      - name: Run macOS media packaging contract tests
        run: bash scripts/test-package-mpv-darwin.sh

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test $FIRST_PARTY_GO_PACKAGES

      - name: Run Go vet
        run: go vet $FIRST_PARTY_GO_PACKAGES

  browser-contracts:
    name: Chromium frontend contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run production-build browser contracts
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  race:
    name: Targeted race detector
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run targeted race tests
        run: go test -race -count=1 ./backend/core ./backend/crypto ./backend/media ./backend/mountcache ./backend/mountcontroller ./backend/sync

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Nil contexts are passed intentionally by boundary-validation tests.
      - name: Run staticcheck correctness analyzers
        run: staticcheck -checks='SA*,-SA1012' $FIRST_PARTY_GO_PACKAGES

      - name: Run govulncheck
        run: govulncheck $FIRST_PARTY_GO_PACKAGES

  wails-build:
    name: Wails build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-15
            platform: darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Windows media parser and packaging contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-mpv-metadata.ps1
          ./scripts/test-package-mpv-windows.ps1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Windows native media tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./backend/nativeplayer

      # Runs on Linux, Windows, and macOS (matrix) so folder download and
      # its tests execute natively on each OS instead of only
      # cross-compiling. Keep in sync with release.yml.
      - name: Run daemon, mount, and folder-download tests
        run: go test -count=1 ./cmd/tdrive ./backend/daemon ./backend/mountfs ./backend/mountcontent ./backend/mountdav ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Vet platform-specific daemon and CLI code
        run: go vet ./cmd/tdrive ./backend/daemon ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Build CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          go build -trimpath -o .ci-bin/tdrive ./cmd/tdrive

      - name: Build and verify Windows CLI package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-cli-release-windows.ps1 -Version ci

          $archive = "dist/TDrive-ci-windows-amd64-cli.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "tdrive-cli-package"
          Expand-Archive -Path $archive -DestinationPath $extractDirectory -Force

          $packageDirectory = Join-Path $extractDirectory "TDrive-ci-windows-amd64-cli"
          foreach ($file in @("tdrive.exe", "README.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDirectory $file) -PathType Leaf)) {
              throw "Windows CLI package is missing $file"
            }
          }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev mpv

      # Uses the checksum-pinned runtime archive when the repository variables
      # are set and the runner's package-manager mpv otherwise. Keep in sync
      # with release.yml.
      - name: Prepare media runtime
        shell: bash
        env:
          TDRIVE_LINUX_MPV_RUNTIME_URL: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_URL }}
          TDRIVE_LINUX_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_SHA256 }}
          TDRIVE_MACOS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_URL }}
          TDRIVE_MACOS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_SHA256 }}
          TDRIVE_WINDOWS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_URL }}
          TDRIVE_WINDOWS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_SHA256 }}
        run: bash scripts/prepare-mpv-runtime.sh

      - name: Test macOS media cache invalidation
        if: runner.os == 'macOS'
        run: bash scripts/test-prepare-mpv-runtime.sh

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # macOS needs the .app bundle (`package`) since the media-bundle contract
      # check below looks for build/bin/TDrive.app. Linux/Windows only need the
      # bare binary (`build`): CI hand-rolls its own AppDir/zip below rather
      # than using the real linux:package (AppImage) / windows:package (NSIS)
      # tasks, which need tools (appimagetool / makensis) not installed here.
      - name: Build Wails app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            wails3 task package VERSION=ci
          else
            wails3 task build VERSION=ci
          fi

      - name: Package and validate Linux media runtime contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$RUNNER_TEMP/tdrive-ci.AppDir"
          mkdir -p "$app_dir/usr/bin"

          app_binary="$(find build/bin -maxdepth 1 -type f -perm -111 -print -quit)"
          [ -n "$app_binary" ] || { echo "no Linux Wails executable found" >&2; exit 1; }
          cp "$app_binary" "$app_dir/usr/bin/TDrive"
          chmod 755 "$app_dir/usr/bin/TDrive"
          if [ -n "${TDRIVE_MPV_TEST_VERSION:-}" ]; then
            TDRIVE_MPV_ALLOW_TEST_VERSION=1 ./scripts/package-mpv-linux.sh "$app_dir" "$TDRIVE_MPV_TEST_VERSION"
          else
            ./scripts/package-mpv-linux.sh "$app_dir"
          fi
          (
            cd "$app_dir/usr/bin/media"
            sha256sum -c media-runtime.sha256
          )

      - name: Package and validate macOS media bundle contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/bin/TDrive.app ]; then
            app_path=build/bin/TDrive.app
          else
            app_path="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          fi
          [ -n "$app_path" ] || { echo "no macOS app bundle found" >&2; exit 1; }
          ./scripts/package-mpv-darwin.sh "$app_path"

      - name: Verify Windows media bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path build/bin -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $app) {
            throw "no Windows executable found in build/bin"
          }
          ./scripts/package-mpv-windows.ps1 $app.FullName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force -Path $app.FullName, "build/bin/media" -DestinationPath "dist/TDrive-windows-amd64-ci.zip"

      - name: Upload Windows CI package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDrive-windows-amd64-ci
          path: dist/TDrive-windows-amd64-ci.zip
          if-no-files-found: error
          retention-days: 7
