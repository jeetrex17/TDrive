name: Release TDrive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verify_android_signing:
        description: Build and verify a signed Android APK without creating a release
        type: boolean
        default: false
      android_tag:
        description: Version to stamp into the Android signing check
        type: string
        default: v2.0.0

permissions:
  contents: read

env:
  CGO_ENABLED: 1
  # main (and anything importing it) needs the gtk3 build tag on Linux - see
  # build/linux/Taskfile.yml for why wails v3 is built against GTK3 +
  # WebKit2GTK-4.1 here instead of its new GTK4 default.
  GOFLAGS: "-tags=gtk3"

jobs:
  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate stable release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/android-version-code.sh "$GITHUB_REF_NAME" >/dev/null

  build:
    name: Build (${{ matrix.platform }})
    needs: validate-release-ref
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_android_signing }}
    # Pinning to ubuntu-22.04 ensures webkit2gtk-4.1 is available (see the
    # gtk3 build tag note on GOFLAGS above).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64

          - os: windows-latest
            platform: windows/amd64

          - os: macos-15
            platform: darwin/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sanitize artifact version
        shell: bash
        run: |
          set -euo pipefail
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^[:alnum:]._-]/-/g')"
          test -n "$version"
          echo "TDRIVE_ARTIFACT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CLI, daemon, mount, and folder-download tests
        run: go test -count=1 ./cmd/tdrive ./backend/daemon ./backend/mountfs ./backend/mountcontent ./backend/mountdav ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Vet platform-specific daemon and CLI code
        run: go vet ./cmd/tdrive ./backend/daemon ./backend/mountadapter ./backend/mountwrite ./backend/mountcontroller ./backend/mountos ./backend/tgclient ./backend/updater ./backend/services/file ./backend/projection

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev mpv

      # Uses the checksum-pinned runtime archive when the repository variables
      # are set and the runner's package-manager mpv otherwise; the bundle
      # manifest records which one shipped. Keep in sync with ci.yml.
      - name: Prepare media runtime
        shell: bash
        env:
          TDRIVE_LINUX_MPV_RUNTIME_URL: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_URL }}
          TDRIVE_LINUX_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_SHA256 }}
          TDRIVE_MACOS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_URL }}
          TDRIVE_MACOS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_SHA256 }}
          TDRIVE_WINDOWS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_URL }}
          TDRIVE_WINDOWS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_SHA256 }}
        run: bash scripts/prepare-mpv-runtime.sh

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Tag builds only; a dispatched branch build keeps the checked-in version.
      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Only the version line inside the info block: the top-level one is
          # the config schema. sed rather than yq, which the Windows runner lacks.
          sed -i.bak -E "/^info:/,/^[^[:space:]]/ s/^([[:space:]]+version:[[:space:]]*).*/\1\"${version}\"/" build/config.yml
          rm -f build/config.yml.bak
          grep -Fqx "  version: \"${version}\"" build/config.yml
          # v3 build assets are static files, not templates, so the bundle
          # plist has to be stamped too or the .app keeps the checked-in version.
          if [ "$RUNNER_OS" = "macOS" ]; then
            for plist in build/darwin/Info.plist build/darwin/Info.dev.plist; do
              plutil -replace CFBundleShortVersionString -string "$version" "$plist"
              plutil -replace CFBundleVersion -string "$version" "$plist"
            done
          fi

      # macOS packages a `.app` bundle (`package`); Linux/Windows only need the
      # bare binary here (`build`) - they're packaged as an AppImage/zip by the
      # steps below rather than through linux:package/windows:package.
      # Always produces build/bin/TDrive(.exe)(.app) - wails v3's Taskfile
      # build has no per-platform -o equivalent, unlike `wails build -o`.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            wails3 task package VERSION="$TDRIVE_ARTIFACT_VERSION"
          else
            wails3 task build VERSION="$TDRIVE_ARTIFACT_VERSION"
          fi

      - name: Acquire AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL_URL: ${{ vars.TDRIVE_APPIMAGETOOL_URL }}
          APPIMAGETOOL_SHA256: ${{ vars.TDRIVE_APPIMAGETOOL_SHA256 }}
        run: |
          set -euo pipefail
          appimagetool="$RUNNER_TEMP/tdrive-appimagetool"
          if [ -z "$APPIMAGETOOL_URL" ] || [ -z "$APPIMAGETOOL_SHA256" ]; then
            echo "::warning::TDRIVE_APPIMAGETOOL_URL and TDRIVE_APPIMAGETOOL_SHA256 are not set; using the continuous appimagetool build."
            curl --fail --location --silent --show-error \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              --output "$appimagetool"
            chmod 755 "$appimagetool"
            echo "TDRIVE_APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"
            exit 0
          fi
          expected_sha256="$(printf '%s' "$APPIMAGETOOL_SHA256" | tr '[:upper:]' '[:lower:]')"
          case "$expected_sha256" in
            *[!0-9a-f]*|'') echo "TDRIVE_APPIMAGETOOL_SHA256 must be a SHA-256 value" >&2; exit 1 ;;
          esac
          if [ "${#expected_sha256}" -ne 64 ]; then
            echo "TDRIVE_APPIMAGETOOL_SHA256 must contain exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error "$APPIMAGETOOL_URL" --output "$appimagetool"
          actual_sha256="$(sha256sum "$appimagetool" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "appimagetool checksum mismatch: expected $expected_sha256, got $actual_sha256" >&2
            exit 1
          fi
          chmod 755 "$appimagetool"
          echo "TDRIVE_APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick

          APPDIR=TDrive.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # App binary
          cp "build/bin/TDrive" "$APPDIR/usr/bin/TDrive"
          chmod +x "$APPDIR/usr/bin/TDrive"

          # Icon from the canonical appicon.png (AppDir root + hicolor theme path)
          convert build/appicon.png -resize 256x256 \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png"
          cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png" "$APPDIR/TDrive.png"

          # Desktop entry (AppDir root + standard location)
          cp build/linux/TDrive.desktop "$APPDIR/usr/share/applications/TDrive.desktop"
          cp build/linux/TDrive.desktop "$APPDIR/TDrive.desktop"

          # Launcher
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/TDrive" "$@"
          SH
          chmod +x "$APPDIR/AppRun"

          # package-mpv-linux validates the runtime's version, architecture,
          # license/source metadata, and a deterministic headless decode. The
          # version override is only set for the package-manager fallback.
          if [ -n "${TDRIVE_MPV_TEST_VERSION:-}" ]; then
            TDRIVE_MPV_ALLOW_TEST_VERSION=1 ./scripts/package-mpv-linux.sh "$APPDIR" "$TDRIVE_MPV_TEST_VERSION"
          else
            ./scripts/package-mpv-linux.sh "$APPDIR"
          fi

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            "$TDRIVE_APPIMAGETOOL" "$APPDIR" "dist/TDrive-${TDRIVE_ARTIFACT_VERSION}-linux-amd64.AppImage"

      # The runner image has no NSIS; the Chocolatey package installs under
      # Program Files (x86) without touching PATH. Keep in sync with ci.yml.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path -LiteralPath (Join-Path $nsis "makensis.exe") -PathType Leaf)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "nsis install failed" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          & (Join-Path $nsis "makensis.exe") /VERSION

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/package-mpv-windows.ps1 "build/bin/TDrive.exe"
          Compress-Archive -Force -Path "build/bin/TDrive.exe", "build/bin/media" -DestinationPath "dist/TDrive-$env:TDRIVE_ARTIFACT_VERSION-windows-amd64.zip"

          # Per-user installer with the same exe and media folder. Its version
          # metadata needs x.y.z, so branch builds keep the checked-in version.
          $installerArgs = @("task", "windows:installer", "INSTALL_SCOPE=user")
          $version = $env:TDRIVE_ARTIFACT_VERSION -replace '^v', ''
          if ($version -match '^\d+\.\d+\.\d+$') { $installerArgs += "PRODUCT_VERSION=$version" }
          & wails3 @installerArgs
          if ($LASTEXITCODE -ne 0) { throw "windows installer build failed" }
          Move-Item -Force "build/bin/TDrive-amd64-installer.exe" "dist/TDrive-$env:TDRIVE_ARTIFACT_VERSION-windows-amd64-setup.exe"

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-cli-release-windows.ps1 -Version $env:TDRIVE_ARTIFACT_VERSION

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH="build/bin/TDrive.app"

          echo "Packaging application from: $APP_PATH"
          ./scripts/package-mpv-darwin.sh "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/TDrive-${TDRIVE_ARTIFACT_VERSION}-macos-arm64.zip"

      - name: Package CLI (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/package-cli-release.sh "$TDRIVE_ARTIFACT_VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # FIX 2: Sanitized the artifact name (removed slashes)
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  android-signing-check:
    name: Verify signed Android APK
    needs: validate-release-ref
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.verify_android_signing &&
      (github.ref == 'refs/heads/mobile-wails' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-signing
    env:
      GOFLAGS: ""
      ANDROID_TAG: ${{ inputs.android_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Android version
        run: bash scripts/android-version-code.sh "$ANDROID_TAG" >/dev/null

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build embedded frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails CLI
        env:
          CGO_ENABLED: 0
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Point the build at the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build Android library
        run: wails3 task android:build PRODUCTION=true ARCH=arm64 VERSION="$ANDROID_TAG"

      - name: Assemble signed Android APK
        env:
          TDRIVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.TDRIVE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TDRIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TDRIVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TDRIVE_ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          for name in TDRIVE_ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Android release-signing secret: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/tdrive-release.keystore"
          umask 077
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$TDRIVE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ANDROID_KEYSTORE_FILE="$keystore"
          export ANDROID_VERSION_NAME="${ANDROID_TAG#v}"
          export ANDROID_VERSION_CODE="$(bash scripts/android-version-code.sh "$ANDROID_TAG")"
          wails3 task android:assemble:apk:release

      - name: Verify signed Android APK
        env:
          TDRIVE_ANDROID_CERT_SHA256: ${{ vars.TDRIVE_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/bin/TDrive.apk"
          test -s "$apk"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools_dir/apksigner"
          test -x "$tools_dir/aapt"

          expected="$(printf '%s' "$TDRIVE_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "TDRIVE_ANDROID_CERT_SHA256 must be the release certificate's SHA-256 fingerprint" >&2
            exit 1
          fi
          certificates="$("$tools_dir/apksigner" verify --verbose --print-certs "$apk")"
          actual="$(printf '%s\n' "$certificates" | bash scripts/android-signer-digests.sh)"
          if [ "$actual" != "$expected" ] || [[ "$certificates" == *"CN=Android Debug"* ]]; then
            echo "Android APK was not signed with the expected release certificate" >&2
            printf 'Expected signer SHA-256: %s\nActual signer SHA-256: %s\n' "$expected" "${actual:-unavailable}" >&2
            printf 'Android build-tools: %s\napksigner output (%s characters):\n' "$(basename "$tools_dir")" "${#certificates}" >&2
            printf '%s\n' "${certificates:-<empty>}" | sed -n '1,80p' >&2
            exit 1
          fi

          code="$(bash scripts/android-version-code.sh "$ANDROID_TAG")"
          package="$("$tools_dir/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package" != *"name='com.jeetraj.tdrive'"* \
             || "$package" != *"versionCode='$code'"* \
             || "$package" != *"versionName='${ANDROID_TAG#v}'"* ]]; then
            echo "Android APK package or version does not match $ANDROID_TAG: $package" >&2
            exit 1
          fi

          unzip -Z1 "$apk" > "$RUNNER_TEMP/tdrive-apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libwails.so' "$RUNNER_TEMP/tdrive-apk-entries.txt"
          if grep -Fxq 'lib/x86_64/libwails.so' "$RUNNER_TEMP/tdrive-apk-entries.txt"; then
            echo "The arm64 Android APK unexpectedly contains an x86_64 library" >&2
            exit 1
          fi
          unzip -p "$apk" lib/arm64-v8a/libwails.so > "$RUNNER_TEMP/tdrive-libwails.so"
          strings -a "$RUNNER_TEMP/tdrive-libwails.so" > "$RUNNER_TEMP/tdrive-libwails.strings"
          for built in frontend/dist/assets/main-*.css frontend/dist/assets/video-*.js; do
            test -f "$built"
            if ! grep -qF "$(basename "$built")" "$RUNNER_TEMP/tdrive-libwails.strings"; then
              echo "Android APK does not embed $(basename "$built")" >&2
              exit 1
            fi
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        env:
          CGO_ENABLED: 0
          GOFLAGS: ""
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Point the build at the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Build Android library
        env:
          GOFLAGS: ""
        run: wails3 task android:build PRODUCTION=true ARCH=arm64 VERSION="$GITHUB_REF_NAME"

      - name: Assemble signed Android APK
        env:
          GOFLAGS: ""
          TDRIVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.TDRIVE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TDRIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TDRIVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TDRIVE_ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          for name in TDRIVE_ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Android release-signing secret: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/tdrive-release.keystore"
          umask 077
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$TDRIVE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ANDROID_KEYSTORE_FILE="$keystore"
          export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export ANDROID_VERSION_CODE="$(bash scripts/android-version-code.sh "$GITHUB_REF_NAME")"
          wails3 task android:assemble:apk:release

      - name: Verify and stage Android APK
        env:
          TDRIVE_ANDROID_CERT_SHA256: ${{ vars.TDRIVE_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/bin/TDrive.apk"
          test -s "$apk"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools_dir/apksigner"
          test -x "$tools_dir/aapt"

          expected="$(printf '%s' "$TDRIVE_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "TDRIVE_ANDROID_CERT_SHA256 must be the release certificate's SHA-256 fingerprint" >&2
            exit 1
          fi
          certificates="$("$tools_dir/apksigner" verify --verbose --print-certs "$apk")"
          actual="$(printf '%s\n' "$certificates" | bash scripts/android-signer-digests.sh)"
          if [ "$actual" != "$expected" ] || [[ "$certificates" == *"CN=Android Debug"* ]]; then
            echo "Android APK was not signed with the expected release certificate" >&2
            printf 'Expected signer SHA-256: %s\nActual signer SHA-256: %s\n' "$expected" "${actual:-unavailable}" >&2
            printf 'Android build-tools: %s\napksigner output (%s characters):\n' "$(basename "$tools_dir")" "${#certificates}" >&2
            printf '%s\n' "${certificates:-<empty>}" | sed -n '1,80p' >&2
            exit 1
          fi

          code="$(bash scripts/android-version-code.sh "$GITHUB_REF_NAME")"
          package="$("$tools_dir/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package" != *"name='com.jeetraj.tdrive'"* \
             || "$package" != *"versionCode='$code'"* \
             || "$package" != *"versionName='${GITHUB_REF_NAME#v}'"* ]]; then
            echo "Android APK package or version does not match $GITHUB_REF_NAME: $package" >&2
            exit 1
          fi

          unzip -Z1 "$apk" > "$RUNNER_TEMP/tdrive-apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libwails.so' "$RUNNER_TEMP/tdrive-apk-entries.txt"
          if grep -Fxq 'lib/x86_64/libwails.so' "$RUNNER_TEMP/tdrive-apk-entries.txt"; then
            echo "The arm64 Android APK unexpectedly contains an x86_64 library" >&2
            exit 1
          fi
          unzip -p "$apk" lib/arm64-v8a/libwails.so > "$RUNNER_TEMP/tdrive-libwails.so"
          strings -a "$RUNNER_TEMP/tdrive-libwails.so" > "$RUNNER_TEMP/tdrive-libwails.strings"
          for built in frontend/dist/assets/main-*.css frontend/dist/assets/video-*.js; do
            test -f "$built"
            if ! grep -qF "$(basename "$built")" "$RUNNER_TEMP/tdrive-libwails.strings"; then
              echo "Android APK does not embed $(basename "$built")" >&2
              exit 1
            fi
          done

          cp "$apk" "dist/TDrive-${GITHUB_REF_NAME}-android-arm64.apk"

      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/TDrive-${{ github.ref_name }}-source.zip" HEAD

      # The in-app updater authenticates this manifest before trusting any
      # digest. Names only, so each entry matches its uploaded asset name.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt.tmp
          mv checksums.txt.tmp checksums.txt

      - name: Sign checksum manifest
        shell: bash
        env:
          TDRIVE_UPDATE_SIGNING_KEY_PEM: ${{ secrets.TDRIVE_UPDATE_SIGNING_KEY_PEM }}
          TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT: ${{ secrets.TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT }}
        run: |
          set -euo pipefail
          if [[ -z "${TDRIVE_UPDATE_SIGNING_KEY_PEM:-}" ]]; then
            echo "The release environment is missing TDRIVE_UPDATE_SIGNING_KEY_PEM." >&2
            exit 1
          fi

          umask 077
          message_file="${RUNNER_TEMP}/tdrive-update-manifest.bin"
          temporary_files=("${message_file}")
          cleanup() {
            rm -f -- "${temporary_files[@]}"
          }
          trap cleanup EXIT

          printf '%s\0' 'TDrive update manifest v1' > "${message_file}"
          cat dist/checksums.txt >> "${message_file}"
          : > dist/checksums.txt.sig

          signing_keys=("${TDRIVE_UPDATE_SIGNING_KEY_PEM}")
          if [[ -n "${TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT:-}" ]]; then
            signing_keys+=("${TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT}")
          fi
          declare -A seen_key_ids=()
          signing_key_ids=()

          for index in "${!signing_keys[@]}"; do
            key_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.pem"
            public_key_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.der"
            signature_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.sig"
            temporary_files+=("${key_file}" "${public_key_file}" "${signature_file}")

            printf '%s' "${signing_keys[$index]}" > "${key_file}"
            openssl pkey -in "${key_file}" -pubout -outform DER -out "${public_key_file}"
            openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${message_file}" -out "${signature_file}"
            if [[ "$(wc -c < "${signature_file}")" -ne 64 ]]; then
              echo "The update signing key is not an Ed25519 key." >&2
              exit 1
            fi

            key_id="$(sha256sum "${public_key_file}" | awk '{print $1}')"
            if [[ -n "${seen_key_ids[$key_id]:-}" ]]; then
              echo "Duplicate update signing key ${key_id}." >&2
              exit 1
            fi
            seen_key_ids[$key_id]=1
            signing_key_ids+=("${key_id}")
            signature="$(base64 -w 0 < "${signature_file}")"
            printf 'tdrive-ed25519-v1 %s %s\n' "${key_id}" "${signature}" >> dist/checksums.txt.sig
          done

          embedded_key_ids="$(IFS=,; printf '%s' "${signing_key_ids[*]}")"
          unset TDRIVE_UPDATE_SIGNING_KEY_PEM TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT
          signing_keys=()
          unset signing_keys
          cleanup
          trap - EXIT

          TDRIVE_RELEASE_MANIFEST_PATH="${GITHUB_WORKSPACE}/dist/checksums.txt" \
          TDRIVE_RELEASE_SIGNATURE_PATH="${GITHUB_WORKSPACE}/dist/checksums.txt.sig" \
          TDRIVE_RELEASE_SIGNING_KEY_IDS="${embedded_key_ids}" \
            go test ./backend/updater -run '^TestReleaseSigningArtifactsUseEmbeddedKeys$' -count=1

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
