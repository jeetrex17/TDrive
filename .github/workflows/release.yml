name: Release TDrive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: 1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # FIX 1: Pinning to ubuntu-22.04 ensures webkit2gtk-4.0 is available
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            output_name: TDrive-linux-amd64

          - os: windows-latest
            platform: windows/amd64
            output_name: TDrive-windows-amd64.exe

          - os: macos-15
            platform: darwin/arm64
            output_name: TDrive-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sanitize artifact version
        shell: bash
        run: |
          set -euo pipefail
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^[:alnum:]._-]/-/g')"
          test -n "$version"
          echo "TDRIVE_ARTIFACT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CLI, daemon, mount, and folder-download tests
        run: go test -count=1 ./cmd/tdrive ./backend/daemon ./backend/mountfs ./backend/mountcontent ./backend/mountdav ./backend/mountcontroller ./backend/mountos ./backend/updater ./backend/services/file ./backend/projection

      - name: Vet platform-specific daemon and CLI code
        run: go vet ./cmd/tdrive ./backend/daemon ./backend/mountcontroller ./backend/mountos ./backend/updater ./backend/services/file ./backend/projection

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # FIX 1: Explicitly install the 4.0 version which Wails expects
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libx11-dev mpv

      # Uses the checksum-pinned runtime archive when the repository variables
      # are set and the runner's package-manager mpv otherwise; the bundle
      # manifest records which one shipped. Keep in sync with ci.yml.
      - name: Prepare media runtime
        shell: bash
        env:
          TDRIVE_LINUX_MPV_RUNTIME_URL: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_URL }}
          TDRIVE_LINUX_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_LINUX_MPV_RUNTIME_SHA256 }}
          TDRIVE_MACOS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_URL }}
          TDRIVE_MACOS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_MACOS_MPV_RUNTIME_SHA256 }}
          TDRIVE_WINDOWS_MPV_RUNTIME_URL: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_URL }}
          TDRIVE_WINDOWS_MPV_RUNTIME_SHA256: ${{ vars.TDRIVE_WINDOWS_MPV_RUNTIME_SHA256 }}
        run: bash scripts/prepare-mpv-runtime.sh

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stamp release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$version" '.info.productVersion = $v' wails.json > "$tmp"
          mv "$tmp" wails.json

      - name: Build
        shell: bash
        run: |
          wails build -clean -platform "${{ matrix.platform }}" -o "${{ matrix.output_name }}" \
            -ldflags "-X main.appVersion=${{ github.ref_name }}"

      - name: Acquire AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL_URL: ${{ vars.TDRIVE_APPIMAGETOOL_URL }}
          APPIMAGETOOL_SHA256: ${{ vars.TDRIVE_APPIMAGETOOL_SHA256 }}
        run: |
          set -euo pipefail
          appimagetool="$RUNNER_TEMP/tdrive-appimagetool"
          if [ -z "$APPIMAGETOOL_URL" ] || [ -z "$APPIMAGETOOL_SHA256" ]; then
            echo "::warning::TDRIVE_APPIMAGETOOL_URL and TDRIVE_APPIMAGETOOL_SHA256 are not set; using the continuous appimagetool build."
            curl --fail --location --silent --show-error \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              --output "$appimagetool"
            chmod 755 "$appimagetool"
            echo "TDRIVE_APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"
            exit 0
          fi
          expected_sha256="$(printf '%s' "$APPIMAGETOOL_SHA256" | tr '[:upper:]' '[:lower:]')"
          case "$expected_sha256" in
            *[!0-9a-f]*|'') echo "TDRIVE_APPIMAGETOOL_SHA256 must be a SHA-256 value" >&2; exit 1 ;;
          esac
          if [ "${#expected_sha256}" -ne 64 ]; then
            echo "TDRIVE_APPIMAGETOOL_SHA256 must contain exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error "$APPIMAGETOOL_URL" --output "$appimagetool"
          actual_sha256="$(sha256sum "$appimagetool" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "appimagetool checksum mismatch: expected $expected_sha256, got $actual_sha256" >&2
            exit 1
          fi
          chmod 755 "$appimagetool"
          echo "TDRIVE_APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick

          APPDIR=TDrive.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # App binary
          cp "build/bin/${{ matrix.output_name }}" "$APPDIR/usr/bin/TDrive"
          chmod +x "$APPDIR/usr/bin/TDrive"

          # Icon from the canonical appicon.png (AppDir root + hicolor theme path)
          convert build/appicon.png -resize 256x256 \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png"
          cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png" "$APPDIR/TDrive.png"

          # Desktop entry (AppDir root + standard location)
          cp build/linux/TDrive.desktop "$APPDIR/usr/share/applications/TDrive.desktop"
          cp build/linux/TDrive.desktop "$APPDIR/TDrive.desktop"

          # Launcher
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/TDrive" "$@"
          SH
          chmod +x "$APPDIR/AppRun"

          # package-mpv-linux validates the runtime's version, architecture,
          # license/source metadata, and a deterministic headless decode. The
          # version override is only set for the package-manager fallback.
          if [ -n "${TDRIVE_MPV_TEST_VERSION:-}" ]; then
            TDRIVE_MPV_ALLOW_TEST_VERSION=1 ./scripts/package-mpv-linux.sh "$APPDIR" "$TDRIVE_MPV_TEST_VERSION"
          else
            ./scripts/package-mpv-linux.sh "$APPDIR"
          fi

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            "$TDRIVE_APPIMAGETOOL" "$APPDIR" "dist/TDrive-${TDRIVE_ARTIFACT_VERSION}-linux-amd64.AppImage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/package-mpv-windows.ps1 "build/bin/${{ matrix.output_name }}"
          Compress-Archive -Force -Path "build/bin/${{ matrix.output_name }}", "build/bin/media" -DestinationPath "dist/TDrive-$env:TDRIVE_ARTIFACT_VERSION-windows-amd64.zip"

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-cli-release-windows.ps1 -Version "${{ github.ref_name }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          # FIX 3: Wails usually outputs "TDrive.app" regardless of the -o flag.
          # We check if the custom named one exists, if not, we use the default.
          if [ -d "build/bin/${{ matrix.output_name }}.app" ]; then
            APP_PATH="build/bin/${{ matrix.output_name }}.app"
          else
            APP_PATH="build/bin/TDrive.app"
          fi
          
          echo "Packaging application from: $APP_PATH"
          ./scripts/package-mpv-darwin.sh "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/TDrive-${TDRIVE_ARTIFACT_VERSION}-macos-arm64.zip"

      - name: Package CLI (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/package-cli-release.sh "${{ github.ref_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # FIX 2: Sanitized the artifact name (removed slashes)
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/TDrive-${{ github.ref_name }}-source.zip" HEAD

      # The in-app updater authenticates this manifest before trusting any
      # digest. Names only, so each entry matches its uploaded asset name.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt.tmp
          mv checksums.txt.tmp checksums.txt

      - name: Sign checksum manifest
        shell: bash
        env:
          TDRIVE_UPDATE_SIGNING_KEY_PEM: ${{ secrets.TDRIVE_UPDATE_SIGNING_KEY_PEM }}
          TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT: ${{ secrets.TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT }}
        run: |
          set -euo pipefail
          if [[ -z "${TDRIVE_UPDATE_SIGNING_KEY_PEM:-}" ]]; then
            echo "The release environment is missing TDRIVE_UPDATE_SIGNING_KEY_PEM." >&2
            exit 1
          fi

          umask 077
          message_file="${RUNNER_TEMP}/tdrive-update-manifest.bin"
          temporary_files=("${message_file}")
          cleanup() {
            rm -f -- "${temporary_files[@]}"
          }
          trap cleanup EXIT

          printf '%s\0' 'TDrive update manifest v1' > "${message_file}"
          cat dist/checksums.txt >> "${message_file}"
          : > dist/checksums.txt.sig

          signing_keys=("${TDRIVE_UPDATE_SIGNING_KEY_PEM}")
          if [[ -n "${TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT:-}" ]]; then
            signing_keys+=("${TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT}")
          fi
          declare -A seen_key_ids=()
          signing_key_ids=()

          for index in "${!signing_keys[@]}"; do
            key_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.pem"
            public_key_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.der"
            signature_file="${RUNNER_TEMP}/tdrive-update-signing-${index}.sig"
            temporary_files+=("${key_file}" "${public_key_file}" "${signature_file}")

            printf '%s' "${signing_keys[$index]}" > "${key_file}"
            openssl pkey -in "${key_file}" -pubout -outform DER -out "${public_key_file}"
            openssl pkeyutl -sign -rawin -inkey "${key_file}" -in "${message_file}" -out "${signature_file}"
            if [[ "$(wc -c < "${signature_file}")" -ne 64 ]]; then
              echo "The update signing key is not an Ed25519 key." >&2
              exit 1
            fi

            key_id="$(sha256sum "${public_key_file}" | awk '{print $1}')"
            if [[ -n "${seen_key_ids[$key_id]:-}" ]]; then
              echo "Duplicate update signing key ${key_id}." >&2
              exit 1
            fi
            seen_key_ids[$key_id]=1
            signing_key_ids+=("${key_id}")
            signature="$(base64 -w 0 < "${signature_file}")"
            printf 'tdrive-ed25519-v1 %s %s\n' "${key_id}" "${signature}" >> dist/checksums.txt.sig
          done

          embedded_key_ids="$(IFS=,; printf '%s' "${signing_key_ids[*]}")"
          unset TDRIVE_UPDATE_SIGNING_KEY_PEM TDRIVE_UPDATE_SIGNING_KEY_PEM_NEXT
          signing_keys=()
          unset signing_keys
          cleanup
          trap - EXIT

          TDRIVE_RELEASE_MANIFEST_PATH="${GITHUB_WORKSPACE}/dist/checksums.txt" \
          TDRIVE_RELEASE_SIGNATURE_PATH="${GITHUB_WORKSPACE}/dist/checksums.txt.sig" \
          TDRIVE_RELEASE_SIGNING_KEY_IDS="${embedded_key_ids}" \
            go test ./backend/updater -run '^TestReleaseSigningArtifactsUseEmbeddedKeys$' -count=1

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
