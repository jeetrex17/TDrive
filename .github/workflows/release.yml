name: Release TDrive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: 1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # FIX 1: Pinning to ubuntu-22.04 ensures webkit2gtk-4.0 is available
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            output_name: TDrive-linux-amd64
            asset_name: TDrive-${{ github.ref_name }}-linux-amd64.AppImage

          - os: windows-latest
            platform: windows/amd64
            output_name: TDrive-windows-amd64.exe
            asset_name: TDrive-${{ github.ref_name }}-windows-amd64.zip

          - os: macos-15
            platform: darwin/arm64
            output_name: TDrive-macos-arm64
            asset_name: TDrive-${{ github.ref_name }}-macos-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # FIX 1: Explicitly install the 4.0 version which Wails expects
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install Windows media dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mpvio.install --no-progress -y

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          wails build -clean -platform "${{ matrix.platform }}" -o "${{ matrix.output_name }}"

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick

          APPDIR=TDrive.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # App binary
          cp "build/bin/${{ matrix.output_name }}" "$APPDIR/usr/bin/TDrive"
          chmod +x "$APPDIR/usr/bin/TDrive"

          # Icon from the canonical appicon.png (AppDir root + hicolor theme path)
          convert build/appicon.png -resize 256x256 \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png"
          cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/TDrive.png" "$APPDIR/TDrive.png"

          # Desktop entry (AppDir root + standard location)
          cp build/linux/TDrive.desktop "$APPDIR/usr/share/applications/TDrive.desktop"
          cp build/linux/TDrive.desktop "$APPDIR/TDrive.desktop"

          # Launcher
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/TDrive" "$@"
          SH
          chmod +x "$APPDIR/AppRun"

          # appimagetool — GitHub runners have no FUSE, so extract-and-run.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage "$APPDIR" "dist/${{ matrix.asset_name }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/package-mpv-windows.ps1 "build/bin/${{ matrix.output_name }}"
          Compress-Archive -Force -Path "build/bin/${{ matrix.output_name }}", "build/bin/media" -DestinationPath "dist/${{ matrix.asset_name }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          # FIX 3: Wails usually outputs "TDrive.app" regardless of the -o flag.
          # We check if the custom named one exists, if not, we use the default.
          if [ -d "build/bin/${{ matrix.output_name }}.app" ]; then
            APP_PATH="build/bin/${{ matrix.output_name }}.app"
          else
            APP_PATH="build/bin/TDrive.app"
          fi
          
          echo "Packaging application from: $APP_PATH"
          ./scripts/package-mpv-darwin.sh "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/${{ matrix.asset_name }}"

      - name: Package CLI (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/package-cli-release.sh "${{ github.ref_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # FIX 2: Sanitized the artifact name (removed slashes)
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/TDrive-${{ github.ref_name }}-source.zip" HEAD

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
