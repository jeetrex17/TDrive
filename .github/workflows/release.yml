name: Release TDrive

# TRIGGER: Only run when a tag starting with 'v' is pushed (e.g. v0.1.0)
on:
  push:
    tags:
      - 'v*'

env:
  CGO_ENABLED: 1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: TDrive-Linux-amd64
          - os: windows-latest
            platform: windows/amd64
            output_name: TDrive-Windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            output_name: TDrive-macOS-Universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21' # Make sure this matches your local Go version

      # Linux needs special libraries for the screen window
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform }} -clean -o ${{ matrix.output_name }}

      # UPLOAD STEP: This sends the files to the Release Page
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/${{ matrix.output_name }}*
          draft: true          
          # draft: true means it won't publish automatically.
          # You can go edit the text first, then click "Publish" yourself.
